# ==========================================
# 0. APPLICATION CORE SETTINGS
# ==========================================
spring.application.name=custom_contest_backend
# Tells Spring Boot to interpret all dates and timestamps in IST
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ==========================================
# 1. NEON CLOUD DATABASE CONNECTION (Secure)
# ==========================================
# This reads from your hidden .env file!
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. JPA & HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
# Show the exact parameters being passed into the ? placeholders
logging.level.org.hibernate.orm.jdbc.bind=WARN
# Using your previous platform property which is perfectly fine
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Forces Hibernate to grab children in chunks of 100 in ONE single query
spring.jpa.properties.hibernate.default_batch_fetch_size=100