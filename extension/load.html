<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body {
  margin: 0;
  padding: 8px;
  background: #1a1a1a;

  /* key change: shrink-wrap content */
  width: max-content;
  height: max-content;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* Button */
.leetcode-btn {
  display: inline-flex;
  align-items: center;

  height: 36px;
  padding: 0 12px;

  background: #242424;
  border: 1px solid #2f2f2f;
  border-radius: 8px;

  text-decoration: none;
  color: #f3f4f6;

  transition: all 0.2s ease;
  white-space: nowrap;
}

.leetcode-btn:hover {
  background: #303030;
  border-color: #404040;
}

.leetcode-btn-title {
  font-size: 13px;
  font-weight: 600;
  color: #f3f4f6;
}
</style>
</head>

<body>

<a href="https://leetcode.com/problemset/?tab=custom-contest" target="_blank"  class="leetcode-btn">
  <span class="leetcode-btn-title">
     Custom Contest Builder
  </span>
</a>

</body>
</html>
