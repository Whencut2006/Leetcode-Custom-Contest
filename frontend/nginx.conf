server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # CRITICAL: This line prevents 404 errors with react-router-dom
        try_files $uri $uri/ /index.html;
    }

    # Optional: Tell the browser to cache your Vite assets for faster loading
    location ~* \.(?:css|js|jpg|svg)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
    }
}